<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanji List | Japanese Ai Ebook</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#1b3954;font-family:system-ui,"Noto Sans Bengali","Noto Sans JP",sans-serif}

<script>
const words=[["一", "いち / ひと", "ichi / hito", "এক"], ["二", "に / ふた", "ni / futa", "দুই"], ["三", "さん / みっ", "san / mi", "তিন"], ["四", "し / よん", "shi / yon", "চার"], ["五", "ご / いつ", "go / itsu", "পাঁচ"], ["六", "ろく / む", "roku / mu", "ছয়"], ["七", "しち / なな", "shichi / nana", "সাত"], ["八", "はち / や", "hachi / ya", "আট"], ["九", "きゅう / ここの", "kyuu / kokono", "নয়"], ["十", "じゅう / とお", "juu / too", "দশ"], ["百", "ひゃく", "hyaku", "একশ"], ["千", "せん", "sen", "এক হাজার"], ["万", "まん", "man", "দশ হাজার"], ["円", "えん", "en", "ইয়েন / বৃত্ত"], ["日", "にち / ひ", "nichi / hi", "দিন / সূর্য"], ["月", "げつ / つき", "getsu / tsuki", "মাস / চাঁদ"], ["火", "か / ひ", "ka / hi", "আগুন"], ["水", "すい / みず", "sui / mizu", "পানি"], ["木", "もく / き", "moku / ki", "গাছ"], ["金", "きん / かね", "kin / kane", "সোনা / টাকা"], ["土", "ど / つち", "do / tsuchi", "মাটি"], ["曜", "よう", "you", "সপ্তাহের দিনের অংশ"], ["年", "ねん / とし", "nen / toshi", "বছর"], ["時", "じ / とき", "ji / toki", "সময় / ঘণ্টা"], ["分", "ふん / ぶん", "fun / bun", "মিনিট / অংশ"], ["半", "はん", "han", "অর্ধেক"], ["今", "こん / いま", "kon / ima", "এখন"], ["先", "せん / さき", "sen / saki", "আগে / সামনে"], ["生", "せい / い", "sei / i", "জীবন / জন্ম"], ["学", "がく / まな", "gaku / mana", "শেখা"], ["校", "こう", "kou", "বিদ্যালয়"], ["本", "ほん / もと", "hon / moto", "বই / মূল"], ["人", "じん / ひと", "jin / hito", "মানুষ"], ["男", "だん / おとこ", "dan / otoko", "পুরুষ"], ["女", "じょ / おんな", "jo / onna", "নারী"], ["子", "し / こ", "shi / ko", "শিশু"], ["友", "ゆう / とも", "yuu / tomo", "বন্ধু"], ["名", "めい / な", "mei / na", "নাম"], ["何", "なに / なん", "nani / nan", "কী"], ["国", "こく / くに", "koku / kuni", "দেশ"], ["山", "さん / やま", "san / yama", "পাহাড়"], ["川", "せん / かわ", "sen / kawa", "নদী"], ["田", "でん / た", "den / ta", "ধানক্ষেত"], ["上", "じょう / うえ", "jou / ue", "উপরে"], ["下", "か / した", "ka / shita", "নিচে"], ["中", "ちゅう / なか", "chuu / naka", "মাঝখানে"], ["大", "だい / おお", "dai / oo", "বড়"], ["小", "しょう / ちい", "shou / chii", "ছোট"], ["左", "さ / ひだり", "sa / hidari", "বাম"], ["右", "う / みぎ", "u / migi", "ডান"], ["前", "ぜん / まえ", "ze function render(){const q=search.value.trim().toLowerCase();grid.replaceChildren();let found=0;words.forEach((w,i)=>{if(!w.join(' ').toLowerCase().includes(q))return;found++;const card=document.createElement('article');card.className='card';const top=document.createElement('div');top.className='top';const kanji=document.createElement('span');kanji.className='kanji';kanji.textContent=w[0];const btn=document.createElement('button');btn.className='play';btn.type='button';btn.textContent='🔊';btn.title='উচ্চারণ শোনো';btn.setAttribute('aria-label',w[0]+' উচ্চারণ শোনো');btn.onclick=()=>{if(!('speechSynthesis' in window)){alert('এই Browser-এ Audio সমর্থিত নয়');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w[1].split(' / ')[0]);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)};top.append(kanji,btn);const rd=document.createElement('div');rd.className='reading';rd.textContent=w[1];const rm=document.createElement('div');rm.className='romaji';rm.textContent=w[2];const mn=document.createElement('div');mn.className='meaning';mn.textContent='বাংলা: '+w[3];const practice=document.createElement('a');practice.className='practice-link';practice.href='practice.html?kanji='+encodeURIComponent(w[0])+'#kanji';practice.textContent='✍️ Practice';practice.setAttribute('aria-label',w[0]+' লিখে অনুশীলন করো');card.append(top,rd,rm,mn,practice);grid.append(card)});count.textContent=found+' / '+words.length+' Kanji';if(!found){const e=document.createElement('p');e.className='empty';e.textContent='কোনো Kanji পাওয়া যায়নি';grid.append(e)}}search.addEventListener('input',render);render();
</script></body></html>
